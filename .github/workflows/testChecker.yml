name: Android CI

on:
  push:
    branches:
      - Test
      - main
  pull_request:
    branches:
      - Test
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        shell: bash
        run: |
          set -e
          ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT

          # ensure path exists
          if [ ! -d "$ANDROID_SDK_ROOT" ]; then
            echo "Android SDK not found at $ANDROID_SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          fi

          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found. Android SDK command line tools are missing."
            exit 1
          fi

          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37" "build-tools;37.0.0"

      - name: Grant execute permission for gradlew
        working-directory: ./code
        run: chmod +x gradlew

      - name: Run unit tests
        working-directory: ./code
        run: ./gradlew test --configuration-cache
